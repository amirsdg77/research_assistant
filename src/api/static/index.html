<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Agent</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>research agent</span>
    </div>
    <div class="session-badge" id="session-badge" hidden></div>
  </header>

  <main class="layout">
    <!-- LEFT: chat column -->
    <section class="chat-column">
      <div class="chat-log" id="chat-log">
        <div class="empty-chat" id="empty-chat">
          <h2>What would you like to investigate?</h2>
          <p>Describe a research goal. I'll plan it, search the web (and any files you attach), and deliver a cited report.</p>
        </div>
      </div>

      <div class="composer">
        <div class="composer-card">
          <div class="file-chips" id="file-chips"></div>
          <textarea
            id="goal-input"
            rows="2"
            placeholder="Ask anything…"
          ></textarea>
          <div class="composer-row">
            <input type="file" id="file-input" multiple
                   accept=".pdf,.docx,.txt,.md" hidden />
            <button class="icon-btn" id="dz-button" type="button" title="Attach files">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>
            <div class="composer-hint" id="status-strip">Ready.</div>
            <button id="run-button" class="send-btn" title="Send (⌘/Ctrl + Enter)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- RIGHT: side panels -->
    <aside class="side-column">
      <div class="side-panel todo-panel">
        <div class="panel-header">
          <span>To-dos <span class="count" id="todo-count">0</span></span>
          <span class="complete-badge" id="complete-badge" hidden>✓ done</span>
        </div>
        <ul class="task-list" id="task-list">
          <li class="empty-state">Tasks will appear when planning finishes.</li>
        </ul>
      </div>

      <div class="side-panel activity-panel">
        <div class="panel-header">
          <span>Activity</span>
          <label class="pause-toggle">
            <input type="checkbox" id="pause-scroll" /> pause
          </label>
        </div>
        <div class="activity-feed" id="activity-feed"></div>
      </div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
